    <!-- Facebook Pixel：投放链接会带 hi_source=facebook&hi_pc=<pixel id> 这两个参数，
    读到就存一天 Cookie（方便同一次访问后续页面 URL 上没带参数也能继续用），hi_source 是
    facebook 时才动态加载 Facebook 官方 Pixel 基础代码，用 hi_pc 当 Pixel ID 初始化。 -->
    <script>
      (function () {
        function getMainDomain() {
          const parts = window.location.hostname.split(".");
          return parts.length > 2 ? parts.slice(-2).join(".") : window.location.hostname;
        }
        function setDayCookie(name, value) {
          const date = new Date();
          date.setTime(date.getTime() + 24 * 60 * 60 * 1000);
          document.cookie = `${name}=${value};expires=${date.toUTCString()};domain=${getMainDomain()};path=/`;
        }
        function getCookieValue(name) {
          const match = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
          return match ? decodeURIComponent(match[1]) : "";
        }
        function getUrlOrCookieParam(key) {
          const fromUrl = new URLSearchParams(window.location.search).get(key);
          if (fromUrl) {
            setDayCookie(key, fromUrl);
            return fromUrl;
          }
          return getCookieValue(key);
        }

        const hiSource = getUrlOrCookieParam("hi_source");
        const hiPc = getUrlOrCookieParam("hi_pc");
        window.__hiSource = hiSource;
        window.__hiPixelCode = hiPc;

        if (hiSource === "facebook" && hiPc) {
          !(function (f, b, e, v, n, t, s) {
            if (f.fbq) return;
            n = f.fbq = function () {
              n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
            };
            if (!f._fbq) f._fbq = n;
            n.push = n;
            n.loaded = true;
            n.version = "2.0";
            n.queue = [];
            t = b.createElement(e);
            t.async = true;
            t.src = v;
            s = b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t, s);
          })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
          window.fbq("init", hiPc);
          window.fbq("track", "PageView");
        }
      })();
    </script>

    <script>
      window.googletag = window.googletag || { cmd: [] };
      let interstitialSlot, anchorSlot;

      googletag.cmd.push(function () {
        interstitialSlot = googletag.defineOutOfPageSlot(
          "/23197833490/alltools1/alltools1_interstitial",
          googletag.enums.OutOfPageFormat.INTERSTITIAL
        );

        if (interstitialSlot) {
          interstitialSlot.addService(googletag.pubads()).setConfig({
            interstitial: {
              triggers: {
                navBar: true,
                unhideWindow: true
              }
            }
          });
          googletag.pubads().addEventListener("slotOnload", (event) => {
            if (interstitialSlot === event.slot) {
              console.log("Interstitial is loaded.");
            }
          });
        }

        googletag.pubads().addEventListener("slotRequested", (event) => {
          const slot = event.slot;
          console.log("Slot", slot.getSlotElementId(), "has been requested.", performance.now());
          if (slot.getSlotElementId() === "detail-mid1") {
            dataLayer.push({ event: "IP_REQUESTED", iptime: performance.now().toFixed(2) });
          }
        });

        // Top Picks "Show More" 用的激励广告：点击时手动请求展示，不像上面的插页广告是
        // Google 自己按 navBar/unhideWindow 这类导航行为触发的。广告关闭、没有广告可填充、
        // 或者 6 秒内广告没准备好，都会调用 onDone 回调直接放行，不会卡住用户看不到后面的内容。
        // 注意：REWARDED 广告位只在第一次点击时真正请求广告；后面几次点击 Show More 直接放行，
        // 不再重复请求——用 refresh() 对已经展示过的激励广告位重复请求，Google 不会正常返回新广告，
        // 会导致按钮卡在 loading 状态出不来。
        let rewardedSlot;
        let rewardedUsed = false;
        // onDone 第二个参数是广告结果（shown/closed/empty/timeout），第一次点击才有值，
        // 后面几次直接放行的场景不传，方便外面区分要不要打点。
        window.showRewardedAd = function (onDone) {
          if (rewardedUsed) {
            onDone();
            return;
          }

          let done = false;
          const finish = (result) => {
            if (done) return;
            done = true;
            rewardedUsed = true;
            onDone(result);
          };
          const timeoutId = setTimeout(() => finish("timeout"), 6000);

          googletag.cmd.push(function () {
            rewardedSlot = googletag.defineOutOfPageSlot(
              "/23197833490/alltools1/alltools1_rewarded",
              googletag.enums.OutOfPageFormat.REWARDED
            );
            if (!rewardedSlot) {
              clearTimeout(timeoutId);
              finish("empty");
              return;
            }
            rewardedSlot.addService(googletag.pubads());
            googletag.pubads().addEventListener("rewardedSlotReady", (event) => {
              if (event.slot === rewardedSlot) {
                clearTimeout(timeoutId);
                // 广告真正展示出来这个时机不会经过 onDone（要等用户关掉广告才会走 finish），
                // 这里单独打一条 shown 事件，跟 closed/empty/timeout 区分开
                window.pushAbleEvent("rewarded_ad_result", {
                  page_type: "rankings_top_picks",
                  result: "shown"
                });
                event.makeRewardedVisible();
              }
            });
            googletag.pubads().addEventListener("rewardedSlotClosed", (event) => {
              if (event.slot === rewardedSlot) finish("closed");
            });
            googletag.pubads().addEventListener("slotRenderEnded", (event) => {
              if (event.slot === rewardedSlot && event.isEmpty) {
                clearTimeout(timeoutId);
                finish("empty");
              }
            });
            googletag.display(rewardedSlot);
          });
        };

        anchorSlot = googletag.defineOutOfPageSlot(
          "/23197833490/alltools1/alltools1_anchor",
          googletag.enums.OutOfPageFormat.TOP_ANCHOR
        );

        if (anchorSlot) {
          anchorSlot.addService(googletag.pubads());
        }
        googletag.pubads().enableSingleRequest();
        googletag.cmd.push(function () {
          googletag.pubads().addEventListener("slotRenderEnded", (event) => {
            // 获取广告单元路径的最后一部分名称
            if (event.isEmpty) {
              const elementId = event.slot.getSlotId().getDomId();
              const element = document.getElementById(elementId);
              const dataSlotValue = element ? element.dataset.slot : "";
              if (dataSlotValue) {
                element.style.display = "none";
                console.log("none", event, element);
                const adsElement = document.getElementById(`${elementId}-ads`);
                console.log(event, adsElement);
                const adScript = document.createElement("script");
                adScript.innerHTML = `(adsbygoogle = window.adsbygoogle || []).push({});`;
                const ins = document.createElement("ins");
                ins.className = "adsbygoogle";
                ins.style.display = "block";
                ins.setAttribute("data-ad-client", "ca-pub-1853000876464912");
                ins.setAttribute("data-ad-slot", dataSlotValue);
                ins.setAttribute("data-ad-format", "rectangle");
                ins.setAttribute("data-full-width-responsive", "true");
                adsElement.appendChild(ins);
                adsElement.appendChild(adScript);
              }
            }
          });
        });
        googletag.enableServices();
      });
    </script>

    <script>
      googletag.cmd.push(() => {
        googletag.display(interstitialSlot);
        googletag.display(anchorSlot);
      });

      window.pv_total = 0;
      const pageLoadTime = performance.now();
      const domain = window.location.hostname.split(".").slice(-2).join("."); // 获取主域名

      // 跟 utils/track.js 里的 trackEvent 是同一套打点逻辑，这边纯 HTML/JS 环境没法 import 那个
      // 模块，所以单独抄一份：同时推 dataLayer（GTM）、gtag（GA4）、fbq（Facebook Pixel，hi_source
      // =facebook 时才会加载）。
      window.pushAbleEvent = function (name, params) {
        const eventName = `able_${name}`;
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({ event: eventName, ...params });
        if (typeof window.gtag === "function") {
          window.gtag("event", eventName, params);
        }
        if (typeof window.fbq === "function") {
          window.fbq("trackCustom", eventName, params);
        }
      };

      const setCookie = (name, value, days, domain) => {
        const date = new Date();
        date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
        const expires = `expires=${date.toUTCString()}`;
        document.cookie = `${name}=${value};${expires};domain=${domain};path=/`;
      };

      const getCookie = (name) => {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(";").shift();
        return null;
      };

      function trackPageView() {
        let totalViews = parseInt(getCookie("pv_total") || "0");
        totalViews += 1;
        setCookie("pv_total", totalViews, 1, domain);

        return totalViews;
      }

      function handlePvEvents(pvTotal) {
        // PV事件映射
        const PV_EVENTS = {
          4: "PV_4",
          5: "PV_5",
          6: "PV_6"
        };

        // 处理特定PV值的事件
        if (PV_EVENTS[pvTotal]) {
          // 检查并触发AL事件
          if (getCookie("clickAL") === "done") {
            dataLayer.push({ event: `D_AL_${PV_EVENTS[pvTotal]}` });
          }
          // 检查并触发IP事件
          if (getCookie("clickIP") === "done") {
            dataLayer.push({ event: `D_IP_${PV_EVENTS[pvTotal]}` });
          }
          // 触发普通PV事件
          dataLayer.push({ event: PV_EVENTS[pvTotal] });
          return;
        }

        // 处理PV > 6的情况
        if (pvTotal > 6) {
          // 处理AL相关事件
          if (getCookie("clickAL") === "done" && getCookie("pv_max_al") !== "done") {
            setCookie("pv_max_al", "done", 1, domain);
            dataLayer.push({ event: "D_AL_PV_6PLUS" });
          }

          // 处理IP相关事件
          if (getCookie("clickIP") === "done" && getCookie("pv_max_ip") !== "done") {
            setCookie("pv_max_ip", "done", 1, domain);
            dataLayer.push({ event: "D_IP_PV_6PLUS" });
          }
          if (getCookie("pv_max") === "done") return;

          dataLayer.push({ event: "PV_6PLUS" });
          setCookie("pv_max", "done", 1, domain);
        }
      }

      // 统一的事件处理函数
      function updatePvCount() {
        window.pv_total = trackPageView();
        handlePvEvents(window.pv_total);
      }

      // 事件监听
      document.addEventListener("DOMContentLoaded", updatePvCount);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          updatePvCount();
        }
      });

      // 快速跳出：跟下面那个只在"点链接跳转"时才触发的 beforeunload 逻辑是两回事，
      // 所以单独开一个监听器。popstate 用来识别用户是不是点了浏览器的前进/后退按钮——
      // 不管后退会落到站内还是站外，一律不计入跳出统计（后退按钮点击本身没法拦截，
      // 只能靠 popstate 事件间接识别）。
      window.addEventListener("popstate", () => {
        window.__viaBackForward = true;
      });
      function getPageTypeForExit() {
        const path = window.location.pathname;
        if (/^\/$/.test(path)) return "home";
        if (/^\/rankings\/?$/.test(path)) return "rankings";
        if (/^\/category\/[\w-]+\/$/.test(path)) return "category_detail";
        if (/^\/category\/?$/.test(path)) return "category";
        if (/^\/search\/?$/.test(path)) return "search";
        if (/^\/app\/.+/.test(path)) return "app_detail";
        if (/^\/game\/.+/.test(path)) return "game_detail";
        if (/^\/download\/.+/.test(path)) return "download";
        return path.replaceAll("/", "") || "unknown";
      }
      // 统计口径：有效进入站点后，不到 3 秒就"离开网站"才算跳出——点站内链接切换到本站
      // 别的页面不算（CustomLink 点击时会把 __internalNavClick 置为 true），点浏览器
      // 前进/后退按钮离开的也不算；点广告走的、关标签页/换地址走的、点下载页跳到
      // Google Play/App Store/APKPure 的，都算真正离开，一律计入。
      // beforeunload 在 iOS Safari/站内 WebView（比如 Facebook App 内置浏览器）上触发不
      // 可靠，pagehide 兼容性更好，两个都监听，用 exitReported 防止同一次离开重复上报两次。
      let exitReported = false;
      function reportExitIfNeeded() {
        if (exitReported) return;
        if (
          performance.now() - pageLoadTime < 3000 &&
          window.__internalNavClick !== true &&
          window.__viaBackForward !== true
        ) {
          exitReported = true;
          window.pushAbleEvent("3s_exit", { page_type: getPageTypeForExit() });
        }
      }
      window.addEventListener("beforeunload", reportExitIfNeeded);
      window.addEventListener("pagehide", reportExitIfNeeded);

      // 初始化标志变量
      window.isUnloaded = false;
      // 监听页面即将卸载事件：beforeunload 在 iOS Safari / 站内 WebView（Facebook 内置
      // 浏览器等）上触发不可靠，跟 able_3s_exit 一样额外加 pagehide 兜底，两个共用同一个
      // 处理函数，靠 isUnloaded 防止同一次离开重复上报两次。
      function handlePageUnload() {
        if (window.isUnloaded) {
          return;
        }
        if (1 === window.clickOpen) {
          // 点击穿插广告：插页广告内容在跨域 iframe 里，GTM 的自动链接点击监测看不到
          // iframe 内部的点击，所以这里不依赖 gtm.linkClick，只要广告正在展示
          // （clickOpen===1）、页面这时候要离开了，就判定为点击穿插触发的跳转
          window.isUnloaded = true;
          dataLayer.push({ event: "D_AL" });
          if (typeof window.fbq === "function") {
            window.fbq("track", "Purchase");
          }
          bge("event", "button", { configId: "905001526682426624" });
          const domain = window.location.hostname.split(".").slice(-2).join("."); // 获取主域名
          setCookie("clickAL", "done", 1, domain);
          return;
        }
        // 广告没在展示时的普通跳转：保留原来的判断逻辑，只有确实检测到页面内链接点击
        // （gtm.linkClick）才算 D_RE，避免把关标签页/地址栏跳转等也误计进来
        var elementUrlIndex = window.dataLayer.findIndex(
          ({ event: eventType }) => "gtm.linkClick" === eventType
        );
        if (-1 === elementUrlIndex) {
          return;
        }
        window.isUnloaded = true;
        // 用户点击跳转
        dataLayer.push({ event: "D_RE" });
      }
      window.addEventListener("beforeunload", handlePageUnload);
      window.addEventListener("pagehide", handlePageUnload);
      // beforeunload/pagehide 兜底之外再加一条独立检测路径：新开标签页时当前页根本不会
      // unload（上面两个事件压根不会触发），iOS 上即使是当前页跳转 beforeunload 也可能不
      // 触发。用 blur 记录"焦点进了插页广告 iframe"这个待确认状态，页面变成 hidden 时如果
      // 待确认状态还在，就判定为点击穿插触发的离开，复用 handlePageUnload 统一上报（内部
      // isUnloaded 去重，不会跟 beforeunload/pagehide 重复上报）。
      window.__pendingVignetteClick = false;
      window.addEventListener("blur", () => {
        // 每次新的 blur 先无条件作废上一次待确认状态，焦点已经转移到别的目标了
        window.__pendingVignetteClick = false;
        if (1 !== window.clickOpen) {
          return;
        }
        const activeElement = document.activeElement;
        const nameAttribute = activeElement && activeElement.getAttribute("name");
        if (
          nameAttribute &&
          -1 !==
            nameAttribute.indexOf("google_ads_iframe_/23197833490/alltools1/alltools1_interstitial")
        ) {
          window.__pendingVignetteClick = true;
        }
      });
      // 顶层页面发生任何点击，说明用户没有跟着广告走（插页广告内容在跨域 iframe 里，真正
      // 点广告不会在我们自己的 document 上产生 click 事件），取消待确认状态。这里特意不用
      // focus 做取消信号——实测 iOS 上点真实广告跳转时，focus 会抢在 visibilitychange 变
      // hidden 之前触发，会把刚设置好的待确认状态提前误清空，导致真实点击反而漏报。
      document.addEventListener(
        "click",
        () => {
          window.__pendingVignetteClick = false;
        },
        true
      );
      window.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden" && window.__pendingVignetteClick) {
          window.__pendingVignetteClick = false;
          handlePageUnload();
        }
      });
      // 监听 hash 变化事件 --- 判断穿插全屏广告出现
      window.addEventListener("hashchange", () => {
        if ("#google_vignette" == window.location.hash) {
          window.clickOpen = 1;
          // 触发穿插
          dataLayer.push({ event: "C_AL" });
          if (typeof window.fbq === "function") {
            window.fbq("track", "AddPaymentInfo");
          }
        }
      });
      // 监听消息事件：用 JSON.parse 后逐字段判断，比整段字符串精确匹配更抗 Google 调整
      // 字段顺序/新增字段——字符串精确匹配一旦对不上会静默失效，不会报错也不好发现
      window.addEventListener("message", (event) => {
        let vignetteMessageData;
        try {
          vignetteMessageData = JSON.parse(event.data);
        } catch (e) {
          return;
        }
        if (
          vignetteMessageData &&
          "adClosed" === vignetteMessageData.eventType &&
          vignetteMessageData.result &&
          1 == vignetteMessageData.result.status &&
          "fullscreen" === vignetteMessageData.googMsgType
        ) {
          window.clickOpen = 0;
          window.__pendingVignetteClick = false;
          // 关闭穿插广告
          dataLayer.push({ event: "G_AL" });
        }
      });
      // 监听失去焦点事件
      window.addEventListener("blur", () => {
        const activeElement = document.activeElement,
          sourceAttribute = activeElement.getAttribute("name");
        if (
          sourceAttribute &&
          -1 !== sourceAttribute.indexOf("google_ads_iframe_/23197833490") &&
          -1 === sourceAttribute.indexOf("anchor_0")
        ) {
          let adStatus = "false";
          if (activeElement) {
            adStatus = activeElement.getAttribute("data-load-complete") || adStatus;
          }
          if ("true" == adStatus) {
            // 点击页内广告
            dataLayer.push({ event: "D_IP" });
            bge("event", "button", { configId: "905001526682426624" });
            const domain = window.location.hostname.split(".").slice(-2).join("."); // 获取主域名
            setCookie("clickIP", "done", 1, domain);
          }
        } else if (sourceAttribute && -1 !== sourceAttribute.indexOf("anchor_0")) {
          // 点击锚定广告
          dataLayer.push({ event: "D_FI" });
        } else if (
          sourceAttributeSrc &&
          -1 !== sourceAttributeSrc.indexOf("googleads.g.doubleclick.net/pagead/ads?")
        ) {
          const closestIns = activeElement.closest("ins");
          let adStatus = "unfilled";
          if (closestIns) {
            adStatus = closestIns.getAttribute("data-ad-status") || adStatus;
          }
          if ("filled" == adStatus) {
            // 点击页内广告
            dataLayer.push({ event: "D_IP" });
            dataLayer.push({ event: "D_IP_ADS" });
          }
        }
      });
    </script>
  </body>
