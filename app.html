<!DOCTYPE html>
<html lang="en">
  <head {{ HEAD_ATTRS }}>
    <meta charset="UTF-8" />
    {{ HEAD }}

    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1853000876464912"
      crossorigin="anonymous"
    ></script>

    <link rel="preload" href="https://securepubads.g.doubleclick.net/tag/js/gpt.js" as="script" />
    <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>

    <script>
      window.googletag = window.googletag || { cmd: [] };
      let interstitialSlot, anchorSlot;

      googletag.cmd.push(function () {
        interstitialSlot = googletag.defineOutOfPageSlot(
          "/23197833490/alltools1/alltools1_interstitial",
          googletag.enums.OutOfPageFormat.INTERSTITIAL
        );

        if (interstitialSlot) {
          interstitialSlot.addService(googletag.pubads()).setConfig({
            interstitial: {
              triggers: {
                navBar: true,
                unhideWindow: true
              }
            }
          });
        }
        anchorSlot = googletag.defineOutOfPageSlot(
          "/23197833490/alltools1/alltools1_anchor",
          googletag.enums.OutOfPageFormat.TOP_ANCHOR
        );

        if (anchorSlot) {
          anchorSlot.addService(googletag.pubads());
        }
        googletag.pubads().enableSingleRequest();
        googletag.cmd.push(function () {
          googletag.pubads().addEventListener("slotRenderEnded", (event) => {
            // 获取广告单元路径的最后一部分名称
            if (event.isEmpty) {
              const elementId = event.slot.getSlotId().getDomId();
              const element = document.getElementById(elementId);
              const dataSlotValue = element ? element.dataset.slot : "";
              if (dataSlotValue) {
                element.style.display = "none";
                console.log("none", event, element);
                const adsElement = document.getElementById(`${elementId}-ads`);
                console.log(event, adsElement);
                const adScript = document.createElement("script");
                adScript.innerHTML = `(adsbygoogle = window.adsbygoogle || []).push({});`;
                const ins = document.createElement("ins");
                ins.className = "adsbygoogle";
                ins.style.display = "block";
                ins.setAttribute("data-ad-client", "ca-pub-1853000876464912");
                ins.setAttribute("data-ad-slot", dataSlotValue);
                ins.setAttribute("data-ad-format", "rectangle");
                ins.setAttribute("data-full-width-responsive", "true");
                adsElement.appendChild(ins);
                adsElement.appendChild(adScript);
              }
            }
          });
        });
        googletag.enableServices();
      });
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HJ2731TT1W"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-HJ2731TT1W");
    </script>
    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-MM4V59GK");
    </script>
    <!-- End Google Tag Manager -->
    <script>
      window.bgdataLayer = window.bgdataLayer || [];
      function bge() {
        bgdataLayer.push(arguments);
      }
      bge("init", "905001526682426624");
    </script>
    <script async src="https://api.imotech.video/ad/events.js?pixel_id=905001526682426624"></script>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in window.navigator) {
          window.navigator.serviceWorker
            .register("/sw.js")
            .then(() => {})
            .catch(() => {});
        }
        window.addEventListener("beforeinstallprompt", (e) => {
          e.preventDefault();
          window.deferredPrompt = e;
        });
      });
    </script>
  </head>
  <body {{ BODY_ATTRS }}>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-MM4V59GK"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    {{ APP }}
    <script>
      googletag.cmd.push(() => {
        googletag.display(interstitialSlot);
        googletag.display(anchorSlot);
      });

      // 初始化标志变量
      window.isUnloaded = false;
      // 监听页面即将卸载事件
      window.addEventListener("beforeunload", () => {
        var elementUrlIndex = window.dataLayer.findIndex(
          ({ event: eventType }) => "gtm.linkClick" === eventType
        );
        // 如果找到了对应事件，且标志变量为 false，则执行逻辑
        if (-1 === elementUrlIndex || window.isUnloaded) {
          return;
        }
        // 根据条件执行不同逻辑
        if (1 === window.clickOpen) {
          // 点击穿插广告
          dataLayer.push({ event: "D_AL" });
          bge("event", "button", { configId: "905001526682426624" });
        } else {
          // 用户点击跳转
          dataLayer.push({ event: "D_RE" });
        }
        window.isUnloaded = true;
      });
      // 监听 hash 变化事件 --- 判断穿插全屏广告出现
      window.addEventListener("hashchange", () => {
        if ("#google_vignette" == window.location.hash) {
          window.clickOpen = 1;
          // 触发穿插
          dataLayer.push({ event: "C_AL" });
          localStorage.removeItem("__lsv__");
        }
      });
      // 监听消息事件
      window.addEventListener("message", (event) => {
        if (
          '{"eventType":"adClosed","result":{"status":1},"googMsgType":"fullscreen"}' === event.data
        ) {
          window.clickOpen = 0;
          // 关闭穿插广告
          dataLayer.push({ event: "G_AL" });
        }
      });
      // 监听失去焦点事件
      window.addEventListener("blur", () => {
        const activeElement = document.activeElement,
          sourceAttribute = activeElement.getAttribute("name");
        if (
          sourceAttribute &&
          -1 !== sourceAttribute.indexOf("google_ads_iframe_/23197833490") &&
          -1 === sourceAttribute.indexOf("anchor_0")
        ) {
          let adStatus = "false";
          if (activeElement) {
            adStatus = activeElement.getAttribute("data-load-complete") || adStatus;
          }
          if ("true" == adStatus) {
            // 点击页内广告
            dataLayer.push({ event: "D_IP" });
            bge("event", "button", { configId: "905001526682426624" });
          }
        } else if (sourceAttribute && -1 !== sourceAttribute.indexOf("anchor_0")) {
          // 点击锚定广告
          dataLayer.push({ event: "D_FI" });
        } else if (
          sourceAttributeSrc &&
          -1 !== sourceAttributeSrc.indexOf("googleads.g.doubleclick.net/pagead/ads?")
        ) {
          const closestIns = activeElement.closest("ins");
          let adStatus = "unfilled";
          if (closestIns) {
            adStatus = closestIns.getAttribute("data-ad-status") || adStatus;
          }
          if ("filled" == adStatus) {
            // 点击页内广告
            dataLayer.push({ event: "D_IP" });
            dataLayer.push({ event: "D_IP_ADS" });
          }
        }
      });
    </script>
  </body>
</html>
